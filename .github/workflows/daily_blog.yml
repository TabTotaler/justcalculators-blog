name: Generate Daily Blog Post

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 UTC
  workflow_dispatch: # Allows manual runs from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai nh3

      - name: Run post generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py

      - name: Commit and push generated blog files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html sitemap.xml rss.xml robots.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-generate daily blog post [skip ci]" && git push)

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
